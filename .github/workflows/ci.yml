name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pilotzia
          POSTGRES_PASSWORD: pilotzia
          POSTGRES_DB: pilotzia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilotzia -d pilotzia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pilotzia:pilotzia@localhost:5432/pilotzia
      AUTH_SECRET: ci-only-not-for-production
      AUTH_TRUST_HOST: "true"
      APP_URL: http://127.0.0.1:3000
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm run audit:production

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Knowledge tests
        run: npm run test:knowledge

      - name: Persistence tests
        run: npm run test:persistence

      - name: Billing economics tests
        run: npm run test:billing

      - name: Operational refresh and scheduling tests
        run: npm run test:operations

      - name: Five-profile product acceptance tests
        run: npm run test:profiles

      - name: Team governance tests
        run: npm run test:team

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Five-profile authenticated runtime smoke tests
        run: |
          npm run start -- -p 3000 > /tmp/pilotzia-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT

          READY=0
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "Pilotzia server did not become ready"
            cat /tmp/pilotzia-next.log
            exit 1
          fi

          npm run test:profiles:runtime || {
            cat /tmp/pilotzia-next.log
            exit 1
          }
