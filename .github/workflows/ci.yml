name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pilotzia
          POSTGRES_PASSWORD: pilotzia
          POSTGRES_DB: pilotzia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilotzia -d pilotzia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pilotzia:pilotzia@localhost:5432/pilotzia
      AUTH_SECRET: ci-only-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Knowledge tests
        run: npm run test:knowledge

      - name: Persistence tests
        run: npm run test:persistence

      - name: Billing economics tests
        run: npm run test:billing

      - name: Operational refresh and scheduling tests
        run: npm run test:operations

      - name: Four-profile product acceptance tests
        run: npm run test:profiles

      - name: Team governance tests
        run: npm run test:team

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
